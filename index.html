<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef6ff" />
    <meta name="description" content="机巢中枢控制台 · 舱体态势、远程控制、视频监控与调试诊断" />
    <title>机巢中枢控制台</title>
    <script>
      // 首屏前确定主题，避免闪白/闪黑
      (function () {
        try {
          var saved = localStorage.getItem('machine:theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0c1830' : '#eef6ff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
